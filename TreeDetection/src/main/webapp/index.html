<!DOCTYPE html>
<html lang="ko">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=2.0">
    <meta name="format-detection" content="telephone=no, address=no, email=no">
    <meta charset="UTF-8">

    <title>차량기반 도심 수목 유지관리를 위한 LIDAR · AI기반 통합플랫폼</title>

    <!-- CSS 링크 -->
    <link rel="stylesheet" type="text/css" href="./css/reset.css">
    <link rel="stylesheet" type="text/css" href="./css/variables.css">
    <link rel="stylesheet" type="text/css" href="./css/layout.css">
    <link rel="stylesheet" type="text/css" href="./css/component.css">
    <link rel="stylesheet" type="text/css" href="./css/main.css">
    <link rel="stylesheet" type="text/css" href="./css/sub.css">
    <link rel="stylesheet" type="text/css" href="./css/viewer.css">
	
	<script type="importmap">
   {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
   }
   </script>
	
    <!-- JS 링크 -->
    <script src="./js/common.js" defer></script>
    <script src="./js/main.js" defer></script>
    <script src="./js/sub.js" defer></script>
    <script type="module" src="./js/viewer.js"></script>
</head>

<body>
    <div class="l-app">
        <!-- 오른쪽: top네비 + 컨텐츠 -->
        <div class="l-wrap">
            <!-- TOP 네비 -->
            <header class="l-header">

                <!-- 숨겨져있다가 사이드네비 접히면 노출되는 로고 -->
                <div class="l-header__left">
                    <a class="l-header__logo" href="./index.html">
                        <span class="l-header__logo-text">
                            <span class="l-header__logo-text-sub">차량 기반 도심 수목 유지관리를 위한</span>
                            <span class="l-header__logo-text-main"><strong>LiDAR·AI</strong> 기반 통합플랫폼</span>
                        </span>
                    </a>
                </div>

                <!-- 현재 페이지 표시 (1~3 depth: li만 추가/삭제) -->
                <nav class="l-header__page" aria-label="현재 위치">
                    <ol class="l-header__breadcrumb">
                        <li class="l-header__breadcrumb-item">AI분석</li>
                        <li class="l-header__breadcrumb-item">수목분석</li>
                        <li class="l-header__breadcrumb-item" aria-current="page">수목 객체 탐지</li>
                    </ol>
                </nav>

                <!-- 사용자 정보, 알림, 로그아웃 버튼 -->
                <div class="l-header__utils">
                    <span class="l-header__user">관리자 <strong>홍길동</strong>님</span>
                    <span class="l-header__divider" aria-hidden="true"></span>
                    <button class="l-header__icon l-header__icon--bell has-alarm" type="button" aria-label="알림"></button>
                    <button class="l-header__icon l-header__icon--logout" type="button" aria-label="로그아웃"></button>
                </div>

                <!-- 모바일(≤1000px): 햄버거 → 사이드 메뉴 -->
                <button
                    class="l-header__menu"
                    type="button"
                    aria-label="메뉴 열기"
                    aria-controls="lSidebar"
                    aria-expanded="false"
                    data-mobile-nav-toggle
                ></button>
            </header>

            <div class="l-body">
                <div class="l-detect">
                    <div class="l-detect__stage" data-detect="result">
                        <div class="l-detect__grid">
                            <!-- 데이터 객체 탐지 화면-->
								<section class="l-detect__card l-detect__card--view">					
								    <div class="l-detect__title">
								        <h3 class="l-detect__title-text">
								            LiDAR 데이터 객체 탐지 화면
								        </h3>
								    </div>							
								    <div class="l-detect__view">								
								        <div id="viewer"></div>	
								        <div id="las-loading">							
									        <p id="las-loading-text">
									            파일을 불러오는 중입니다...
									        </p>
								    	</div>													
								    </div>								
								</section>

                            <!-- 탐지 결과 요약 -->
                            <section class="l-detect__card l-detect__card--summary">
                                <div class="l-detect__title">
                                    <h3 class="l-detect__title-text">탐지 결과 요약</h3>
                                </div>

                                <div class="l-detect__summary">
                                    <div class="l-detect__total">
                                        <span class="l-detect__total-label">총 탐지 객체수</span>
                                        <strong class="l-detect__total-value" id="detected-tree-count">0</strong>
                                    </div>    
                                </div>
                            </section>
                          
                                <!-- 객체탐지 결과 리스트 -->
								<section class="l-detect__card l-detect__card--list">
								
								    <div class="l-detect__title">
								        <h3 class="l-detect__title-text">
								            객체 탐지 결과 리스트
								        </h3>
								    </div>
								
								    <!-- 객체 유형 필터 -->
								    <div class="l-detect__filter"
								         role="tablist"
								         aria-label="객체 유형 필터"
								         data-detect-filter>
								
								        <button class="l-detect__filter-btn is-active"
								                type="button"
								                role="tab"
								                aria-selected="true"
								                data-detect-filter-btn="all">
								
								            전체
								            <span class="l-detect__filter-badge"
								                  id="detected-list-count">0</span>
								        </button>
								
								        <button class="l-detect__filter-btn"
								                type="button"
								                role="tab"
								                aria-selected="false"
								                data-detect-filter-btn="tree">
								
								            수목
								            <span class="l-detect__filter-badge"
								                  id="tree-count">0</span>
								        </button>						
								
								    </div>
								
								    <!-- 객체 탐지 결과 테이블 -->
								    <div class="l-detect__list">
								
								        <div class="l-detect__table-wrap">
								
								            <table class="l-detect__table">
								
								                <colgroup>
								                    <col style="width: 10%;">
								                    <col style="width: 15%;">
								                    <col style="width: auto;">
								                    <col style="width: 15%;">
								                    <col style="width: 15%;">
								                </colgroup>
								
								                <thead>
								                    <tr>
								                        <th scope="col">순번</th>
								                        <th scope="col">유형</th>
								                        <th scope="col">위치</th>
								                        <th scope="col">높이(m)</th>
								                        <th scope="col">수관폭(m)</th>
								                    </tr>
								                </thead>
								
								                <!-- JSON 데이터가 JavaScript로 생성되는 영역 -->
								                <tbody id="tree-list" data-detect-list>
								                </tbody>								
								            </table>								
								        </div>
								    </div>
									<!-- 페이지네이션 -->
									<div class="l-detect__pagination">
									    <nav
									        id="tree-pagination"
									        class="c-paging"
									        aria-label="객체 탐지 결과 페이지네이션">
									    </nav>
									</div>
								</section>
                            
                            <!-- 객체 상세 정보 -->
							<section class="l-detect__card l-detect__card--detail">					
							    <div class="l-detect__title">
							        <h3 class="l-detect__title-text">
							            객체 상세 정보
							        </h3>
							    </div>							
							    <!-- 선택된 수목의 JSON 데이터 표시 -->
							    <div class="l-detect__info" id="tree-detail">							
							        <p class="empty-message">
							            수목을 선택하면 상세정보가 표시됩니다.
							        </p>							
							    </div>							
							</section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 모바일 사이드 메뉴 딤 -->
        <div class="l-sidebar-dim" data-mobile-nav-close hidden></div>     
    </div>
</body>
</html>
